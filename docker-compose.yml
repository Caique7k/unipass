name: ${COMPOSE_PROJECT_NAME:-unipass}

x-backend-build: &backend-build
  context: ./backend
  args:
    PRISMA_GENERATE_DATABASE_URL: ${PRISMA_GENERATE_DATABASE_URL:-postgresql://placeholder:placeholder@postgres:5432/unipass_db}

x-backend-common: &backend-common
  build: *backend-build
  restart: unless-stopped
  init: true
  env_file:
    - path: ./backend/.env
      format: raw
  environment:
    NODE_ENV: ${NODE_ENV:-production}
    DATABASE_URL: ${DATABASE_URL_DOCKER}
    HOST: ${BACKEND_HOST:-0.0.0.0}
    PORT: ${BACKEND_PORT:-4000}
    APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
    REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    REDIS_DB: ${REDIS_DB:-0}
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - ${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --save 60 1000 --appendonly yes --requirepass "$${REDIS_PASSWORD}";
        fi
        exec redis-server --save 60 1000 --appendonly yes;
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$${REDIS_PASSWORD}" ]; then
            redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG;
          else
            redis-cli ping | grep -q PONG;
          fi
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  backend-migrate:
    <<: *backend-common
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  backend:
    <<: *backend-common
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "${BACKEND_PORT:-4000}"
    ports:
      - ${BACKEND_HOST_BIND:-127.0.0.1}:${BACKEND_HOST_PORT:-4000}:${BACKEND_PORT:-4000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:" + (process.env.PORT || "4000")).then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 5

  backend-worker:
    <<: *backend-common
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["npm", "run", "start:worker:prod"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_ANDROID_APP_URL: ${NEXT_PUBLIC_ANDROID_APP_URL:-}
        NEXT_PUBLIC_IOS_APP_URL: ${NEXT_PUBLIC_IOS_APP_URL:-}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOSTNAME: ${FRONTEND_HOSTNAME:-0.0.0.0}
      PORT: ${FRONTEND_PORT:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_ANDROID_APP_URL: ${NEXT_PUBLIC_ANDROID_APP_URL:-}
      NEXT_PUBLIC_IOS_APP_URL: ${NEXT_PUBLIC_IOS_APP_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "${FRONTEND_PORT:-3000}"
    ports:
      - ${FRONTEND_HOST_BIND:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:${FRONTEND_PORT:-3000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:" + (process.env.PORT || "3000")).then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.seu-dominio.com}
      API_DOMAIN: ${API_DOMAIN:-api.seu-dominio.com}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-infra@seu-dominio.com}
    ports:
      - ${PROXY_HOST_BIND:-0.0.0.0}:${PROXY_HTTP_PORT:-80}:80
      - ${PROXY_HOST_BIND:-0.0.0.0}:${PROXY_HTTPS_PORT:-443}:443
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
